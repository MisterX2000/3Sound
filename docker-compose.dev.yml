services:
  soundboard:
    build: .
    container_name: soundboard-dev
    ports:
      - "8000:8000"
    volumes:
      # Mount local sounds folder to container so new sounds are instantly available
      - ./sounds:/app/sounds
    environment:
      - SOUNDS_DIR=/app/sounds
      # Optional environment overrides:
      # - APP_TITLE=Soundboard
      # - DEFAULT_VIEW_MODE=flat # 'flat' or 'folder'
      # - DEFAULT_VOLUME=80 # 0-100
      # - DEFAULT_ALLOW_OVERLAP=true # true or false
      # - DEFAULT_MUTED=false # true or false
      # - AUDIO_CACHE_SIZE=30
      # - HIDE_EMPTY_FOLDERS=true
      # - EXTRACT_EMBEDDED_ART=true
    restart: unless-stopped
