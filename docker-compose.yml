services:
  soundboard:
    image: ghcr.io/misterx2000/3sound:latest
    container_name: soundboard
    ports:
      - "8000:8000"
    volumes:
      # Mount local sounds folder to container so new sounds are instantly available
      - ./sounds:/app/sounds
    environment:
      - SOUNDS_DIR=/app/sounds
    restart: unless-stopped
