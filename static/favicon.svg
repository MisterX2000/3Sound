<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />
  
  <!-- Stylized Speaker & Audio Waveform -->
  <g transform="translate(116, 126)" filter="url(#glow)">
    <!-- Speaker Body -->
    <path d="M70 70 L130 70 L200 20 L200 240 L130 190 L70 190 Z" fill="url(#accentGrad)" />
    <!-- Audio Wave Arc 1 -->
    <path d="M235 90 A60 60 0 0 1 235 170" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" />
    <!-- Audio Wave Arc 2 -->
    <path d="M265 60 A100 100 0 0 1 265 200" fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round" />
  </g>
</svg>
