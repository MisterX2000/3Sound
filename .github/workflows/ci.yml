name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.15"
          enable-cache: true
          cache-suffix: "${{ github.job }}"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run Ruff Lint Check
        run: uv run poe lint

      - name: Run Ruff Format Check
        run: uv run poe format-check

      - name: Run ty Type Check
        run: uv run poe types

  frontend:
    name: Frontend Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.15"
          enable-cache: true
          cache-suffix: "${{ github.job }}"

      - name: Set up Python
        run: uv python install

      - name: Install Python dependencies
        run: uv sync --locked --dev

      - name: Run Svelte Type Check
        run: uv run poe check-frontend

      - name: Build Svelte Frontend
        run: uv run poe build-frontend

  test:
    name: Run Pytest & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.15"
          enable-cache: true
          cache-suffix: "${{ github.job }}"

      - name: Set up Python
        run: uv python install

      - name: Install Python dependencies
        run: uv sync --locked --dev

      - name: Build Frontend for Integration Tests
        run: uv run poe build-frontend

      - name: Run Pytest with Coverage
        run: |
          uv run pytest --cov=. --cov-report=term-missing --cov-report=markdown:coverage.md

      - name: Publish Coverage Report to Step Summary
        if: always()
        run: |
          if [ -f coverage.md ]; then
            echo "### Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
            cat coverage.md >> $GITHUB_STEP_SUMMARY
          fi

  release:
    name: Create GitHub Release
    needs: [lint, frontend, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract Release Notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 -c "
          import re, sys
          version = sys.argv[1]
          changelog = open('CHANGELOG.md', 'r', encoding='utf-8').read()
          pattern = rf'## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\n\[.*?\]:|\Z)'
          match = re.search(pattern, changelog, re.DOTALL)
          if match:
              notes = match.group(1).strip()
              with open('release_notes.md', 'w', encoding='utf-8') as f:
                  f.write(notes + '\n')
              print(f'Extracted release notes for version {version}:')
              print(notes)
          else:
              print(f'No matching release notes found in CHANGELOG.md for version {version}')
          " "$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s release_notes.md ]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release_notes.md \
              --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
