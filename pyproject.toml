[project]
name = "soundboard"
version = "0.1.0"
description = "Web soundboard using FastAPI, Uvicorn, and Tailwind CSS"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "mutagen>=1.48.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "bump-my-version>=1.6.7",
    "ruff>=0.17.2",
    "ty>=0.0.92",
]

[tool.bumpversion]
current_version = "0.1.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
tag_name = "v{new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
pre_commit_hooks = ["uv sync --upgrade", "git add uv.lock"]
