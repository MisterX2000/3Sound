[project]
name = "soundboard"
version = "0.1.0"
description = "Web soundboard using FastAPI, Uvicorn, and Tailwind CSS"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "mutagen>=1.48.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "ty>=0.0.92",
]
