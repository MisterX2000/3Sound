[project]
name = "soundboard"
version = "0.5.0"
description = "Web soundboard using FastAPI, Uvicorn, and Tailwind CSS"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "mutagen>=1.48.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "bump-my-version>=1.6.7",
    "poethepoet>=0.49.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "ty>=0.0.94",
]

[tool.bumpversion]
current_version = "0.5.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
tag_name = "v{new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
pre_commit_hooks = ["uv sync --upgrade", "git add uv.lock"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "create_samples.py",
    "update_vendor.py",
    ".venv/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.poe.tasks]
start = { cmd = "python main.py", help = "Launch local soundboard server" }
serve = { ref = "start", help = "Alias for start" }
dev = { cmd = "fastapi dev main.py", help = "Launch development server with hot-reload" }
lint = { cmd = "ruff check .", help = "Run Ruff linter" }
lint-fix = { cmd = "ruff check --fix .", help = "Automatically fix Ruff lint issues" }
format = { cmd = "ruff format .", help = "Format code with Ruff" }
format-check = { cmd = "ruff format --check .", help = "Verify code formatting with Ruff" }
types = { cmd = "ty check .", help = "Run static type checking with ty" }
test = { cmd = "pytest", help = "Run automated test suite" }
coverage = { cmd = "pytest --cov=. --cov-report=term-missing", help = "Run test suite with coverage report" }
check = { sequence = ["lint", "format-check", "types", "test"], help = "Run all mandatory quality checks" }
fix = { sequence = ["lint-fix", "format"], help = "Automatically fix lint and format issues" }
samples = { cmd = "python create_samples.py", help = "Generate sample audio files & embedded artwork" }
vendor = { cmd = "python update_vendor.py", help = "Download latest vendor Alpine.js and Tailwind CSS" }
outdated = { cmd = "uv tree --depth 1 --outdated", help = "Check for outdated dependencies" }
bump = { cmd = "bump-my-version bump", help = "Bump version across pyproject.toml" }
