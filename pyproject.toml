[project]
name = "soundboard"
version = "0.7.0"
description = "Web soundboard using FastAPI, Uvicorn, and Tailwind CSS"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "mutagen>=1.48.0",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "main:app"

[dependency-groups]
dev = [
    "bump-my-version>=1.6.7",
    "poethepoet>=0.49.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "ty>=0.0.94",
]

[tool.bumpversion]
current_version = "0.7.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
tag_name = "v{new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
pre_commit_hooks = ["uv sync --upgrade", "git add uv.lock"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "create_samples.py",
    ".venv/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.poe.tasks]
build-frontend = { cmd = "npm --prefix frontend run build", help = "Build Svelte 5 frontend with Vite" }
check-frontend = { cmd = "npm --prefix frontend run check", help = "Type-check Svelte 5 frontend with svelte-check" }
dev-frontend = { cmd = "npm --prefix frontend run dev", help = "Launch Vite development server with hot-reload" }
server-dev = { cmd = "fastapi dev", help = "Launch development server with hot-reload" }
server-prod = { cmd = "fastapi run", help = "Launch production soundboard server" }
dev = { parallel = ["server-dev", "dev-frontend"], help = "Launch development server and Vite dev server in parallel" }
start = { sequence = ["build-frontend", "server-prod"], help = "Build Svelte frontend and launch soundboard server" }
serve = { ref = "start", help = "Alias for start" }
lint = { cmd = "ruff check .", help = "Run Ruff linter" }
lint-fix = { cmd = "ruff check --fix .", help = "Automatically fix Ruff lint issues" }
format = { cmd = "ruff format .", help = "Format code with Ruff" }
format-check = { cmd = "ruff format --check .", help = "Verify code formatting with Ruff" }
types = { cmd = "ty check .", help = "Run static type checking with ty" }
test = { cmd = "pytest", help = "Run automated test suite" }
coverage = { cmd = "pytest --cov=. --cov-report=term-missing", help = "Run test suite with coverage report" }
check = { sequence = ["build-frontend", "check-frontend", "lint", "format-check", "types", "test"], help = "Run all mandatory quality checks" }
fix = { sequence = ["lint-fix", "format"], help = "Automatically fix lint and format issues" }
samples = { cmd = "python create_samples.py", help = "Generate sample audio files & embedded artwork" }
outdated = { cmd = "uv tree --depth 1 --outdated", help = "Check for outdated dependencies" }
bump = { cmd = "bump-my-version bump", help = "Bump version across pyproject.toml" }
